[project]
name = "gcw"
version = "0.1.0"
description = "Minimal CE-only workspace for TF, BT, and BGT cache-processor experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "tokenizers>=0.20",
    "huggingface_hub>=0.24",
    "datasets>=3.0,<4",
    "tqdm>=4.66",
    "wandb>=0.18",
    "filelock>=3.15",
    "certifi>=2024.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
gcw = "gcw.cli:main"

[project.optional-dependencies]
cpu = ["torch>=2.7"]
# causal-conv1d 1.6.2.post1 publishes CUDA 12 wheels through Torch 2.10.
gpu = ["torch>=2.10,<2.11"]
rocm = ["torch>=2.7", "pytorch-triton-rocm"]
eval = ["lm-eval>=0.4", "transformers>=5,<6", "pillow>=10.0", "accelerate>=1.0"]
convert = ["transformers>=5,<6"]
qwen35 = [
    "causal-conv1d==1.6.2.post1",
    "flash-linear-attention>=0.5.1",
    "tilelang==0.1.12",
    "transformers>=5,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "black>=26.5.1",
]

[tool.uv]
default-groups = []
python-preference = "only-managed"
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }, { extra = "rocm" }]]
constraint-dependencies = [
    "nvidia-cublas<0",
    "nvidia-cufft<0",
    "nvidia-cufile<0",
    "nvidia-curand<0",
    "nvidia-cuda-cupti<0",
    "nvidia-cuda-nvrtc<0",
    "nvidia-cuda-runtime<0",
    "nvidia-cudnn-cu13<0",
    "nvidia-cusolver<0",
    "nvidia-cusparse<0",
    "nvidia-cusparselt-cu13<0",
    "nvidia-nccl-cu13<0",
    "nvidia-nvjitlink<0",
    "nvidia-nvshmem-cu13<0",
    "nvidia-nvtx<0",
]

[tool.uv.extra-build-dependencies]
# Build the extension against the same Torch/CUDA ABI selected by the runtime extra.
causal-conv1d = [{ requirement = "torch", match-runtime = true }]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "extra != 'gpu' and extra != 'rocm'" },
    { index = "pytorch-cu128", extra = "gpu" },
    { index = "pytorch-rocm", extra = "rocm" },
]
pytorch-triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: network- or download-dependent tests",
    "gpu: requires a CUDA GPU",
]

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.black]
line-length = 80
