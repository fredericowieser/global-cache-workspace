task: logiqa_opsd_generate
dataset_path: EleutherAI/logiqa
dataset_name: logiqa
dataset_kwargs:
  trust_remote_code: true
output_type: generate_until
training_split: train
validation_split: validation
test_split: test
doc_to_text: !function utils_opsd_mc.logiqa_doc_to_text
doc_to_target: !function utils_opsd_mc.logiqa_doc_to_target
process_results: !function utils_opsd_mc.process_logiqa
generation_kwargs:
  do_sample: false
  until:
    - <|im_end|>
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
