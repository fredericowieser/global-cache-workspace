task: theoremqa
dataset_path: TIGER-Lab/TheoremQA
dataset_name: null
output_type: generate_until
test_split: test
# Type-aware scoring lives in theoremqa_utils.process_results - the default
# exact_match metric cannot grade TheoremQA's float/int/bool/list/option
# answers (string compare fails on 0.5 vs 1/2, 3.14 vs 3.14159, True vs true).
# Prompt is the RAW question (matching gsm8k_openmath, which scores 35%): the
# OMI-2-SFT'd backbones emit \boxed{} naturally on a bare question. An added
# "reason step by step" instruction pushed them off-distribution and zeroed
# the smoke. Image questions
# (Picture != None, 53/800) stay in the denominator to match prior text-only
# reporting. (v1 used exact_match + numeric regex and scored ~3% vs paper ~11%.)
doc_to_text: "{{Question}}"
doc_to_target: "{{Answer}}"
process_results: !function theoremqa_utils.process_results
num_fewshot: 0
generation_kwargs:
  until:
    - "</s>"
    - "<|end_of_text|>"
    - "<|eot_id|>"
    - "\n\nQuestion:"
    - "\nQuestion:"
  do_sample: false
  temperature: 0.0
repeats: 1
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: 2.2
