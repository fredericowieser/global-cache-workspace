model:
  variant: longshot
  family: smollm
  sequence_len: 32
  vocab_size: 128
  hidden_size: 32
  intermediate_size: 64
  num_layers: 2
  num_heads: 4
  num_kv_heads: 2
  head_dim: 8
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  tie_embeddings: true
  cache_processor:
    process_every: 6
    topk: 0
    topk_heads: 2
    score: attn_l2
    head_selection_method: learned_contextual
    internal_iteration_score: learned_contextual
    hidden_size: 8
    intermediate_size: 16
    num_layers: 1
    num_heads: 1
    num_kv_heads: 1
    iterations: 2
    gate_init: -5.0
    per_cache_head_projections: false
    gradient_checkpointing: true
    encoder_method: linear
    encoder_query_source: learned
    unrope_keys: false
    encoder_seq_len: 6
longshot_selector_training:
  warmup_end: 0.05
  soft_end: 0.15
  second_hardening_start: 0.60
  hard_start: 0.90
  initial_temperature: 2.0
  intermediate_temperature: 0.35
  final_temperature: 0.1
  initial_suppression: 0.0
  intermediate_suppression: 2.0
  final_suppression: 5.0
data:
  kind: random
mode: pretrain
distributed: none
freeze_backbone: false
output_dir: runs/smoke_longshot_selector
batch_size: 2
sequence_len: 18
max_steps: 20
learning_rate: 0.001
warmup_steps: 1
precision: bf16_mixed
save_every: 0
