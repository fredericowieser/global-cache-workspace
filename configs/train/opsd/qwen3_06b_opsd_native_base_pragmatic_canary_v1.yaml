model:
  variant: bgt
  family: qwen3
  sequence_len: 8192
  vocab_size: 151936
  hidden_size: 1024
  intermediate_size: 3072
  num_layers: 28
  num_heads: 16
  num_kv_heads: 8
  head_dim: 128
  rope_theta: 1000000.0
  norm_eps: 1.0e-6
  tie_embeddings: true
  qk_norm: true
  rotary_style: llama
  cache_processor:
    process_every: 64
    topk: 32
    score: attn_l2
    hidden_size: 1344
    intermediate_size: 5632
    num_layers: 1
    num_heads: 16
    num_kv_heads: 16
    norm_eps: 1.0e-6
    rope_theta: 10000.0
    gate_init: -5.0
    attention_dropout: 0.0
    update_stream: kv
    out_proj_init: normal
    gate_mode: sigmoid
    processor_mode: standard
    writer_head_fraction: 1.0
    salience_temperature: 1.0
    kv_score_init_k: 0.25
    kv_score_init_v: 0.75

data:
  kind: openmath_prompts
  data_dir: /mnt/jfs-01/shared/gcw/data/OpenMathInstruct-2/train.jsonl
  tokenizer: hf:/mnt/jfs-01/shared/gcw/hf/Qwen3-0.6B-base-v1
  sft_skip_rows: 0
  sft_take_rows: 64

mode: cot_distillation
distributed: none
freeze_backbone: true
backbone_checkpoint: /mnt/jfs-01/shared/gcw/checkpoints/base_backbones/qwen3_06b/tf-v1
output_dir: /mnt/jfs-01/shared/gcw/experiments/qwen3_06b_opsd_native_base_pragmatic_v1/canary-steps1-bs1
batch_size: 1
sequence_len: 8192
max_steps: 1
learning_rate: 1.0e-4
adam_beta1: 0.9
adam_beta2: 0.999
adam_eps: 1.0e-8
weight_decay: 0.0
grad_clip: 1.0
bf16: true
seed: 24
save_every: 0

distillation:
  epochs: 1
  record_cache_displacements: true
  teacher_thinking: true
  student_thinking: false
  teacher_trajectory_mode: native_full
  visible_trajectory_mode: both
  max_teacher_reasoning_tokens: 3072
  max_teacher_completion_tokens: 4096
  max_response_tokens: 2048
  temperature: 1.1
  top_p: 1.0
  top_k: 0
  token_clip: null
  kl_sequence_chunk_size: 32
  response_process_every: 64
  boundary_selection: configured
  gradient_accumulation_steps: 1
  max_optimizer_steps: 1
  reasoning_open_text: "<think>\n"
  reasoning_close_text: "</think>\n\n"
  close_reasoning_at_eos: false
  skip_invalid_traces: true

wandb:
  enabled: true
  project: global-cache-workspace
  name: qwen3-06b-opsd-native-base-pragmatic-v1-canary-steps1-bs1
  group: opsd-native-base-pragmatic-v1
  mode: online
  resume: never
  log_every: 1
  tags:
    - opsd
    - native-full
    - both-visible-trajectories
    - qwen3-0.6b
    - pragmatic-parity-waiver
    - converted_GCW_Qwen3_0.6B_base_not_numerically_identical_to_HF
    - steps-1

metadata:
  campaign: opsd-native-base-pragmatic-v1
  scientific_scope: pragmatic_same_gcw_backbone_sensitivity_after_failed_hf_parity
  required_conversion_parity: /mnt/jfs-01/shared/gcw/checkpoints/base_backbones/qwen3_06b/tf-v1/parity.json
  required_conversion_diagnostic: /mnt/jfs-01/shared/gcw/checkpoints/base_backbones/qwen3_06b/tf-v1/diagnostics/layerwise-distribution-v1-fp64.json
  conversion_parity_waiver: configs/protocols/qwen3_06b_opsd_pragmatic_parity_waiver_v2.json
  comparison_reference: configs/train/bottleneck_llm/qwen3_06b_bgt_from_sft_frozen.yaml
  backbone_label: converted_GCW_Qwen3_0.6B_base_not_numerically_identical_to_HF
  distillation_effective_batch_examples: 1
  requested_optimizer_steps: 1
