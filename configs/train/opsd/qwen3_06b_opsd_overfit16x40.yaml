model:
  variant: bgt
  family: qwen3
  sequence_len: 8192
  vocab_size: 151936
  hidden_size: 1024
  intermediate_size: 3072
  num_layers: 28
  num_heads: 16
  num_kv_heads: 8
  head_dim: 128
  rope_theta: 1000000.0
  norm_eps: 1.0e-6
  tie_embeddings: true
  qk_norm: true
  rotary_style: llama
  cache_processor:
    process_every: 64
    topk: 32
    score: attn_l2
    hidden_size: 1344
    intermediate_size: 5632
    num_layers: 1
    num_heads: 16
    num_kv_heads: 16
    norm_eps: 1.0e-6
    rope_theta: 10000.0
    gate_init: -5.0
    attention_dropout: 0.0
    update_stream: kv
    out_proj_init: normal
    gate_mode: sigmoid
    processor_mode: standard
    writer_head_fraction: 1.0
    salience_temperature: 1.0
    kv_score_init_k: 0.25
    kv_score_init_v: 0.75

data:
  kind: openmath_prompts
  data_dir: /mnt/jfs-01/shared/gcw/data/OpenMathInstruct-2/train.jsonl
  tokenizer: hf:/mnt/jfs-01/shared/bottleneck_llm/sft/qwen3-0.6b/final_model
  sft_skip_rows: 0
  sft_take_rows: 21

mode: cot_distillation
distributed: none
freeze_backbone: true
backbone_checkpoint: /mnt/jfs-01/shared/gcw/checkpoints/sft_backbones/qwen3_06b/tf
output_dir: /mnt/jfs-01/shared/gcw/experiments/qwen3_06b_opsd_v0/overfit-16x40-exact-kl-v3
batch_size: 1
sequence_len: 8192
max_steps: 1
learning_rate: 1.0e-4
adam_beta1: 0.9
adam_beta2: 0.999
adam_eps: 1.0e-8
weight_decay: 0.0
grad_clip: 1.0
bf16: true
seed: 24
save_every: 0

distillation:
  epochs: 40
  overfit_diagnostic: true
  expected_locked_examples: 16
  teacher_thinking: true
  student_thinking: false
  max_teacher_reasoning_tokens: 1024
  max_response_tokens: 512
  temperature: 1.1
  top_p: 1.0
  top_k: 0
  token_clip: null
  kl_sequence_chunk_size: 32
  response_process_every: 64
  boundary_selection: configured
  gradient_accumulation_steps: 1
  reasoning_open_text: "<think>\n"
  reasoning_close_text: "</think>\n\n"
  close_reasoning_at_eos: true
  skip_invalid_traces: true

wandb:
  enabled: false
