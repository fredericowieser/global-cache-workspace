model:
  variant: bgt
  family: qwen3
  sequence_len: 8192
  vocab_size: 151936
  hidden_size: 1024
  intermediate_size: 3072
  num_layers: 28
  num_heads: 16
  num_kv_heads: 8
  head_dim: 128
  rope_theta: 1000000.0
  norm_eps: 1.0e-6
  tie_embeddings: true
  qk_norm: true
  rotary_style: llama
  cache_processor:
    process_every: 64
    topk: 32
    score: attn_l2
    hidden_size: 1344
    intermediate_size: 5632
    num_layers: 1
    num_heads: 16
    num_kv_heads: 16
    norm_eps: 1.0e-6
    rope_theta: 10000.0
    gate_init: -3.0
    attention_dropout: 0.0
    update_stream: kv
    out_proj_init: normal
    gate_mode: sigmoid
    processor_mode: standard
    writer_head_fraction: 1.0
    salience_temperature: 1.0
    kv_score_init_k: 0.25
    kv_score_init_v: 0.75

data:
  kind: openmath_prompts
  data_dir: /mnt/jfs-01/shared/gcw/data/OpenMathInstruct-2/train.jsonl
  tokenizer: hf:/mnt/jfs-01/shared/gcw/hf/Qwen3-0.6B-base-v1
  sft_skip_rows: 0
  sft_take_rows: 128

mode: cot_distillation
distributed: none
freeze_backbone: true
backbone_checkpoint: /mnt/jfs-01/shared/gcw/checkpoints/base_backbones/qwen3_06b/tf-v1
output_dir: /mnt/jfs-01/shared/gcw/experiments/spikes/qwen3_06b_opsd_hf_dynamic_pilot128_v1
batch_size: 1
sequence_len: 8192
max_steps: 1
learning_rate: 3.0e-4
adam_beta1: 0.9
adam_beta2: 0.999
adam_eps: 1.0e-8
weight_decay: 0.0
grad_clip: 1.0
bf16: true
seed: 24
save_every: 0

distillation:
  epochs: 1
  record_cache_displacements: true
  teacher_thinking: true
  student_thinking: false
  teacher_trajectory_mode: native_full
  visible_trajectory_mode: both
  max_teacher_reasoning_tokens: 3072
  max_teacher_completion_tokens: 4096
  max_response_tokens: 2048
  temperature: 1.1
  top_p: 1.0
  top_k: 0
  token_clip: null
  kl_sequence_chunk_size: 32
  response_process_every: 64
  boundary_selection: configured
  gradient_accumulation_steps: 4
  execution_microbatch_size: 1
  require_precomputed_teacher_traces: true
  teacher_trace_backend: hf_dynamic
  teacher_trace_checkpoint: /mnt/jfs-01/shared/gcw/hf/Qwen3-0.6B-base-v1
  teacher_trace_batch_size: 64
  max_optimizer_steps: 8
  reasoning_open_text: "<think>\n"
  reasoning_close_text: "</think>\n\n"
  close_reasoning_at_eos: false
  skip_invalid_traces: true

wandb:
  enabled: false
  project: global-cache-workspace
  name: qwen3-06b-opsd-hf-dynamic-pilot128-v1
  group: opsd-hf-dynamic-experimental
  mode: offline
  resume: never
  log_every: 1
  tags:
    - opsd
    - hf-dynamic-teacher
    - cross-implementation-distillation
    - experimental

metadata:
  campaign: opsd-hf-dynamic-pilot128-v1
  scientific_scope: exploratory_cross_implementation_teacher_cache_and_processor_training
  teacher_backend_label: original_HF_Qwen3_0.6B_base
  student_backbone_label: converted_GCW_Qwen3_0.6B_base_not_numerically_identical_to_HF
  conversion_parity_waiver: configs/protocols/qwen3_06b_opsd_pragmatic_parity_waiver_v2.json
  fixed_teacher_batch_plan: contiguous_source_order_chunks_of_64
  distillation_effective_batch_examples: 4
  requested_optimizer_steps: 8
