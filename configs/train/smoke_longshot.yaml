model:
  variant: longshot
  family: smollm
  sequence_len: 32
  vocab_size: 128
  hidden_size: 32
  intermediate_size: 64
  num_layers: 2
  num_heads: 4
  num_kv_heads: 2
  head_dim: 8
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  tie_embeddings: true
  cache_processor:
    process_every: 6
    topk: 0
    topk_heads: 2
    score: attn_l2
    hidden_size: 8
    intermediate_size: 16
    num_layers: 1
    num_heads: 1
    num_kv_heads: 1
    gate_init: -5.0
    per_cache_head_projections: false
    gradient_checkpointing: true
    encoder_method: linear
    encoder_query_source: learned
    unrope_keys: false
    encoder_seq_len: 6
data:
  kind: random
mode: pretrain
distributed: none
freeze_backbone: false
output_dir: runs/smoke_longshot
batch_size: 2
sequence_len: 18
max_steps: 2
learning_rate: 0.001
warmup_steps: 1
bf16: false
save_every: 0
