model:
  variant: bt
  family: llama
  sequence_len: 8192
  vocab_size: 128256
  hidden_size: 2048
  intermediate_size: 8192
  num_layers: 16
  num_heads: 32
  num_kv_heads: 8
  head_dim: 64
  rope_theta: 500000.0
  norm_eps: 1.0e-5
  tie_embeddings: true
  rotary_style: llama
  legacy_bottleneck_generate: true
  cache_processor:
    process_every: 64
    topk: 32
    score: attn_l2
    hidden_size: 512
    intermediate_size: 2240
    num_layers: 1
    num_heads: 16
    num_kv_heads: 16
    norm_eps: 1.0e-6
    rope_theta: 10000.0
    gate_init: -5.0
    attention_dropout: 0.0
data:
  kind: sft
  dataset: data/OpenMathInstruct-2/train.jsonl
  tokenizer: hf
  tokenizer_source: /mnt/jfs-01/shared/bottleneck_llm/sft/llama-3.2-1b/final_model
  sft_skip_rows: 128000
  sft_take_rows: 128000
  response_prefix: "\n"
mode: sft
distributed: ddp
freeze_backbone: true
backbone_checkpoint: runs/converted_sft/llama32_1b_tf/checkpoint
output_dir: runs/bottleneck_compat/llama32_1b_bt_from_sft
batch_size: 16
sequence_len: 512
max_steps: 1000
total_batch_size: 65536
learning_rate: 1.0e-4
adam_beta2: 0.999
warmup_steps: 0
warmdown_ratio: 0.0
weight_decay: 0.0
grad_clip: 1.0
precision: bf16_mixed
seed: 24
save_every: 100
wandb:
  enabled: true
  project: global-cache-workspace
  name: llama32-1b-bt-from-sft
  group: bottleneck-compat
  tags: [bottleneck-llm, bt, llama-3.2-1b, sft-backbone]
