model:
  variant: tf
  family: smollm
  sequence_len: 32
  vocab_size: 128
  hidden_size: 32
  intermediate_size: 64
  num_layers: 2
  num_heads: 4
  num_kv_heads: 2
  head_dim: 8
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  tie_embeddings: true
data:
  kind: random
mode: pretrain
distributed: none
trainable: all
output_dir: runs/smoke_tf
batch_size: 2
sequence_len: 16
max_steps: 2
learning_rate: 0.001
warmup_steps: 1
bf16: false
save_every: 0
