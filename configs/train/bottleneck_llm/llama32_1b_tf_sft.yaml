batch_size: 16
sequence_len: 512
max_steps: 1000
total_batch_size: 65536
learning_rate: 0.0001
warmup_steps: 0
warmdown_ratio: 0.0
weight_decay: 0.0
grad_clip: 1.0
bf16: true
seed: 24
save_every: 100
wandb:
  enabled: true
  project: global-cache-workspace
  name: llama32-1b-tf-sft
