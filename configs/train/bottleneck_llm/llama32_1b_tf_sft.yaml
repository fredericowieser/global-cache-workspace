model:
  variant: tf
  family: llama
  sequence_len: 8192
  vocab_size: 128256
  hidden_size: 2048
  intermediate_size: 8192
  num_layers: 16
  num_heads: 32
  num_kv_heads: 8
  head_dim: 64
  rope_theta: 500000.0
  norm_eps: 1.0e-05
  tie_embeddings: true
  qk_norm: false
  rotary_style: llama
  cache_processor: null
  legacy_bottleneck_generate: false
data:
  kind: sft
  dataset: /mnt/jfs-01/shared/gcw/data/OpenMathInstruct-2/train.jsonl
  tokenizer: hf
  tokenizer_source: /mnt/jfs-01/shared/bottleneck_llm/sft/llama-3.2-1b/final_model
