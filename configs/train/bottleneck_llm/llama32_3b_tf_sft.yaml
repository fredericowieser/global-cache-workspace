model:
  variant: tf
  family: llama
  sequence_len: 8192
  vocab_size: 128256
  hidden_size: 3072
  intermediate_size: 8192
  num_layers: 28
  num_heads: 24
  num_kv_heads: 8
  head_dim: 128
  rope_theta: 500000.0
  norm_eps: 1.0e-05
  tie_embeddings: true
  qk_norm: false
  rotary_style: llama
  cache_processor: null
  legacy_bottleneck_generate: false
data:
  kind: sft
  dataset: /mnt/jfs-01/shared/gcw/data/OpenMathInstruct-2/train.jsonl
  tokenizer: hf
  tokenizer_source: /mnt/jfs-01/shared/bottleneck_llm/sft/llama-3.2-3b/final_model
  sft_take_rows: 128000
  response_prefix: "\n"
mode: sft
distributed: ddp
freeze_backbone: false
backbone_checkpoint: /mnt/jfs-01/shared/gcw/checkpoints/sft_backbones/llama32_3b/tf
output_dir: runs/bottleneck_llm/llama32_3b_tf_sft
batch_size: 8
sequence_len: 512
max_steps: 1000
total_batch_size: 65536
learning_rate: 0.0001
adam_beta2: 0.999
warmup_steps: 0
warmdown_ratio: 0.0
weight_decay: 0.0
grad_clip: 1.0
precision: bf16_mixed
seed: 24
save_every: 100
wandb:
  enabled: true
  project: global-cache-workspace
  name: llama32-3b-tf-sft
  group: bottleneck-llm-reproduction
  tags:
  - bottleneck-llm
  - tf
  - llama-3.2-3b
  - openmath
